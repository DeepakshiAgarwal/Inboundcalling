name: Refresh inbound dashboard

on:
  schedule:
    # Twice an hour, 08:07-22:37 IST. GitHub can start scheduled runs late or skip some.
    - cron: "37 2 * * *"
    - cron: "7,37 3-16 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python tests/test_dashboard.py

      - name: Data saved by the last run (aggregates only)
        uses: actions/cache@v4
        with:
          path: data/store.json
          key: store-v2-${{ github.run_id }}
          restore-keys: store-v2-

      - name: Pull from Metabase and build
        env:
          METABASE_URL: https://metabase.wiom.in
          METABASE_DATABASE_ID: "113"
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: python build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deploy
